name: Publish PRMS table supplement (DEV only)
# DEV-ONLY data lane (2026-10-14, ia-use-levels). Restores PRMS tables the
# converter dropped onto a NEW immutable prefix and writes the DEV-only pointer
# prdb.manifest.dev.json. It never writes the global prdb.manifest.json, which
# the release line reads; staging/prod only ever run promoted DEV images.
# Trigger: a push to the DEV branch that changes the request file. After it is
# green, redeploy DEV (deploy.yml workflow_dispatch, environment=dev).
on:
  push:
    branches: [feature/innovation-platform-foundation]
    paths: [.github/prms-publish-dev-request.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-prms-dev
  cancel-in-progress: false
jobs:
  publish:
    environment: DEV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse anything but the DEV branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/feature/innovation-platform-foundation" ]]; then
            echo "::error::DEV branch only"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::972793825893:role/cicd/github-actions-cgiar-innovation-analytics-DEV-deploy
          aws-region: eu-central-1
      - run: pip install boto3 cryptography requests
      - name: Apply, verify and publish the supplement (DEV pointer only)
        run: python3 .github/scripts/publish-prms-dev.py
        env:
          IA_PRMS_DEV_SUPPLEMENT_KEY: ${{ secrets.IA_PRMS_DEV_SUPPLEMENT_KEY }}
