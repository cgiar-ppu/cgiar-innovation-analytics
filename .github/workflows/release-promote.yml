name: IA verified image promotion
on:
  push:
    branches: [feat/ia-release-20260914]
    paths: [.github/promotion-request.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ia-release-promotion
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.request.outputs.stage }}
      environment: ${{ steps.request.outputs.environment }}
      account: ${{ steps.request.outputs.account }}
      sha: ${{ steps.request.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          r=json.loads(Path('.github/promotion-request.json').read_text())
          env,account={'staging':('TST','053142643230'),'prod':('PRD','207258148366')}[r['stage']]
          assert re.fullmatch('[a-f0-9]{40}',r['sha'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"stage={r['stage']}\nenvironment={env}\naccount={account}\nsha={r['sha']}\n")
          PY
  promote:
    needs: request
    environment: ${{ needs.request.outputs.environment }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      SOURCE_SHA: ${{ needs.request.outputs.sha }}
      STAGE: ${{ needs.request.outputs.stage }}
      SSO_ISSUER: ${{ vars.IA_SSO_ISSUER }}
      SSO_CLIENT: ${{ vars.IA_SSO_CLIENT_ID }}
      SSO_DOMAIN: ${{ vars.IA_SSO_DOMAIN }}
      SSO_ORIGIN: ${{ vars.IA_SSO_ORIGIN }}
      SSO_ADMINS: ${{ vars.IA_SSO_ADMIN_SUBJECTS }}
      INVITED_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      # Identity intentionally lives in DEV account; application client is stage-specific.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::972793825893:role/cicd/github-actions-cgiar-innovation-analytics-DEV-deploy
          aws-region: eu-central-1
      - name: Verify shared identity and exact target callback
        env:
          EXPECTED_ACCOUNT: '972793825893'
        run: python3 .github/scripts/verify-sso-environment.py
      - name: Pull tested immutable DEV image
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin 972793825893.dkr.ecr.eu-central-1.amazonaws.com
          docker pull 972793825893.dkr.ecr.eu-central-1.amazonaws.com/cgiar-ia-service:$SOURCE_SHA
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.request.outputs.account }}:role/cicd/github-actions-cgiar-innovation-analytics-${{ needs.request.outputs.environment }}-deploy
          aws-region: eu-central-1
      - name: Copy identical image into target account
        env:
          EXPECTED_ACCOUNT: ${{ needs.request.outputs.account }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          aws ecr describe-repositories --repository-names cgiar-ia-service >/dev/null 2>&1 || aws ecr create-repository --repository-name cgiar-ia-service --image-scanning-configuration scanOnPush=true >/dev/null
          aws ecr get-login-password | docker login --username AWS --password-stdin $EXPECTED_ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com
          docker tag 972793825893.dkr.ecr.eu-central-1.amazonaws.com/cgiar-ia-service:$SOURCE_SHA $EXPECTED_ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/cgiar-ia-service:$SOURCE_SHA
          docker push $EXPECTED_ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/cgiar-ia-service:$SOURCE_SHA
      # Env-power (AWS cost sprint, Nov 2026): TEST may be asleep (EC2 stopped by the env-power controller);
      # the SSM steps below need a running server. Wake it via its URL (fallback: start the stopped
      # instance), wait until healthy, keep it in use until the job ends. STAGING ONLY: never runs for prod.
      - name: Wake staging and hold it (env-power, staging only)
        if: needs.request.outputs.stage == 'staging'
        run: |
          OUT=$(aws cloudformation describe-stacks --stack-name cgiar-ia-staging \
            --query "Stacks[0].Outputs[?OutputKey=='AgentURL' || OutputKey=='InstanceId'].[OutputKey,OutputValue]" \
            --output text 2>/dev/null || true)
          AGENT_URL=$(echo "$OUT" | awk '$1=="AgentURL"{print $2}')
          INSTANCE_ID=$(echo "$OUT" | awk '$1=="InstanceId"{print $2}')
          bash .github/scripts/env_power_wake.sh "$AGENT_URL" /api/health "${INSTANCE_ID:--}" 420
      - run: pip install 'boto3>=1.35,<2'
      - name: Deploy with data preservation and fail-closed auth checks
        env:
          EXPECTED_ACCOUNT: ${{ needs.request.outputs.account }}
          RELEASE_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_ID_1: ${{ vars.SUBNET_ID_1 }}
          SUBNET_ID_2: ${{ vars.SUBNET_ID_2 }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: python3 .github/scripts/release-deploy.py
