name: "One-off: Enable S3 versioning on artifacts buckets"

# One-off maintenance workflow. Enables S3 versioning on the prod and dev
# artifacts buckets so a bad PutObject cannot silently corrupt the litestream
# replica or the prdb.sqlite snapshot. Triggered only when this file itself is
# pushed on the feature branch. DELETE this workflow after it has run once.
on:
  push:
    paths: ['.github/workflows/one-off-s3-versioning.yml']
    branches: ['feature/innovation-platform-foundation']

jobs:
  prod-versioning:
    name: Enable versioning (prod artifacts bucket)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::207258148366:role/cicd/github-actions-cgiar-innovation-analytics-PRD-deploy
          aws-region: eu-central-1
          audience: sts.amazonaws.com

      - name: Enable versioning on prod artifacts bucket
        run: |
          aws s3api put-bucket-versioning \
            --bucket cgiar-ia-artifacts-207258148366 \
            --versioning-configuration Status=Enabled \
            --region eu-central-1
          echo "Prod versioning status:"
          aws s3api get-bucket-versioning \
            --bucket cgiar-ia-artifacts-207258148366 \
            --region eu-central-1

  dev-versioning:
    name: Enable versioning (dev artifacts bucket)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::972793825893:role/cicd/github-actions-cgiar-innovation-analytics-DEV-deploy
          aws-region: eu-central-1
          audience: sts.amazonaws.com

      - name: Enable versioning on dev artifacts bucket
        run: |
          aws s3api put-bucket-versioning \
            --bucket cgiar-ia-artifacts-972793825893 \
            --versioning-configuration Status=Enabled \
            --region eu-central-1
          echo "Dev versioning status:"
          aws s3api get-bucket-versioning \
            --bucket cgiar-ia-artifacts-972793825893 \
            --region eu-central-1
