name: IA live release verification
on:
  push:
    branches: [feat/ia-release-20260914]
    paths: [.github/smoke-request.json]
permissions:
  contents: read
  id-token: write
jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.request.outputs.stage }}
      environment: ${{ steps.request.outputs.environment }}
      account: ${{ steps.request.outputs.account }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('.github/smoke-request.json'))
          env,account={'dev':('DEV','972793825893'),'staging':('TST','053142643230'),'prod':('PRD','207258148366')}[r['stage']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"stage={r['stage']}\nenvironment={env}\naccount={account}\n")
          PY
  verify:
    needs: request
    environment: ${{ needs.request.outputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.request.outputs.account }}:role/cicd/github-actions-cgiar-innovation-analytics-${{ needs.request.outputs.environment }}-deploy
          aws-region: eu-central-1
      # Env-power (AWS cost sprint, Nov 2026): TEST may be asleep (EC2 stopped by the env-power controller);
      # the SSM steps below need a running server. Wake it via its URL (fallback: start the stopped
      # instance), wait until healthy, keep it in use until the job ends. STAGING ONLY: never runs for prod.
      - name: Wake staging and hold it (env-power, staging only)
        if: needs.request.outputs.stage == 'staging'
        run: |
          OUT=$(aws cloudformation describe-stacks --stack-name cgiar-ia-staging \
            --query "Stacks[0].Outputs[?OutputKey=='AgentURL' || OutputKey=='InstanceId'].[OutputKey,OutputValue]" \
            --output text 2>/dev/null || true)
          AGENT_URL=$(echo "$OUT" | awk '$1=="AgentURL"{print $2}')
          INSTANCE_ID=$(echo "$OUT" | awk '$1=="InstanceId"{print $2}')
          bash .github/scripts/env_power_wake.sh "$AGENT_URL" /api/health "${INSTANCE_ID:--}" 420
      - run: pip install 'boto3>=1.35,<2'
      - run: python3 .github/scripts/run-release-smoke.py
        env:
          STAGE: ${{ needs.request.outputs.stage }}
          EXPECTED_ACCOUNT: ${{ needs.request.outputs.account }}
