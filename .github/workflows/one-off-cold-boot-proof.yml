name: One-off Cold-Boot Restore Proof (dev)

# ---------------------------------------------------------------------------
# PURPOSE (temporary, one-off — delete after the proof is captured):
#   Prove the litestream S3 restore path on a genuinely COLD first boot of a
#   brand-new EC2 instance (empty /opt/cgiar-ia/synapsis host bind-mount).
#
#   The dev EC2 (AgentInstance) is a standalone AWS::EC2::Instance. To get a
#   genuinely cold boot we force CloudFormation to REPLACE it (not stop/start):
#   replacement gives a brand-new instance with a fresh EBS root volume, so
#   /opt/cgiar-ia/synapsis is empty and litestream must restore chat.db from S3
#   on the very first container start.
#
#   Replacement is forced by bumping the root EBS VolumeSize (30 -> 31 GiB);
#   a root-device size change is a replacement-requiring property for
#   AWS::EC2::Instance. (A UserData change is only stop/start — same volume —
#   so it would NOT clear the host dir.)
#
#   The previous attempt of this workflow terminated the instance out-of-band
#   first, which left the stack in UPDATE_ROLLBACK_FAILED (CFN tried to
#   stop an already-gone instance). This version first recovers the stack via
#   continue-update-rollback --resources-to-skip AgentInstance, then deploys.
#
#   DEV account (972793825893) only. Never targets prod.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [feature/innovation-platform-foundation]
    paths:
      - '.github/workflows/one-off-cold-boot-proof.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPO_NAME: cgiar-ia-service
  STACK_NAME: cgiar-ia-dev
  STAGE: dev
  EXPECTED_ACCOUNT: '972793825893'
  CONTAINER_NAME: cgiar-innovation-analytics

jobs:
  cold-boot-proof:
    name: Cold-boot restore proof (dev)
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (dev OIDC deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify target account
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Target: ${{ env.EXPECTED_ACCOUNT }} | Actual: $ACTUAL_ACCOUNT"
          if [[ "$ACTUAL_ACCOUNT" != "${{ env.EXPECTED_ACCOUNT }}" ]]; then
            echo "::error::Account mismatch! Expected ${{ env.EXPECTED_ACCOUNT }}, got $ACTUAL_ACCOUNT"
            exit 1
          fi

      - name: Record S3 replica state before cold boot
        run: |
          echo "=== S3 litestream replica BEFORE cold boot ==="
          aws s3 ls "s3://cgiar-ia-artifacts-${{ env.EXPECTED_ACCOUNT }}/litestream/chat.db/" --recursive || true

      - name: Recover stack from UPDATE_ROLLBACK_FAILED if needed
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NONE")
          echo "Stack status: $STATUS"
          if [ "$STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Continuing rollback, skipping AgentInstance (its old physical instance was terminated)..."
            aws cloudformation continue-update-rollback \
              --stack-name "${{ env.STACK_NAME }}" \
              --resources-to-skip AgentInstance
            aws cloudformation wait stack-rollback-complete --stack-name "${{ env.STACK_NAME }}" || true
            NEWSTATUS=$(aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" \
              --query 'Stacks[0].StackStatus' --output text)
            echo "Post-recovery status: $NEWSTATUS"
            if [ "$NEWSTATUS" != "UPDATE_ROLLBACK_COMPLETE" ] && [ "$NEWSTATUS" != "UPDATE_COMPLETE" ]; then
              echo "::error::Stack did not recover (status=$NEWSTATUS)."
              exit 1
            fi
          fi

      - name: Capture pre-deploy instance id
        id: pre
        run: |
          OLD_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text 2>/dev/null || echo "none")
          echo "CFN currently references instance: $OLD_ID (expected to be the terminated id)"
          echo "old_id=$OLD_ID" >> "$GITHUB_OUTPUT"

      - name: Force replacement — bump root EBS VolumeSize 30 -> 31
        run: |
          # A change to the root-device VolumeSize forces CloudFormation to
          # REPLACE the instance (brand-new instance, fresh empty EBS volume),
          # which is exactly the cold-boot scenario we want to prove.
          sed -i 's/^\(\s*VolumeSize:\s*\)30\s*$/\131/' infra/cloudformation.yaml
          echo "=== BlockDeviceMappings after edit ==="
          grep -n -A 6 "BlockDeviceMappings" infra/cloudformation.yaml | head -10

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy CloudFormation stack (replaces AgentInstance)
        run: |
          PARAMS="Stage=${{ env.STAGE }}"
          PARAMS="$PARAMS EcrImageTag=${{ env.STAGE }}"
          PARAMS="$PARAMS InstanceType=${{ vars.INSTANCE_TYPE || 't3.large' }}"
          PARAMS="$PARAMS VpcId=${{ vars.VPC_ID }}"
          PARAMS="$PARAMS SubnetId1=${{ vars.SUBNET_ID_1 }}"
          if [ -n "${{ vars.ACM_CERTIFICATE_ARN }}" ]; then
            PARAMS="$PARAMS AcmCertificateArn=${{ vars.ACM_CERTIFICATE_ARN }}"
            PARAMS="$PARAMS SubnetId2=${{ vars.SUBNET_ID_2 }}"
          fi
          if [ -n "${{ vars.HOSTED_ZONE_ID }}" ]; then
            PARAMS="$PARAMS HostedZoneId=${{ vars.HOSTED_ZONE_ID }}"
          fi

          aws cloudformation deploy \
            --template-file infra/cloudformation.yaml \
            --stack-name "${{ env.STACK_NAME }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides $PARAMS \
            --tags Project=cgiar-innovation-analytics Environment=${{ env.STAGE }}

      - name: Get NEW instance id
        id: newinst
        run: |
          NEW_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          echo "New instance: $NEW_ID"
          echo "new_id=$NEW_ID" >> "$GITHUB_OUTPUT"
          if [ "$NEW_ID" = "${{ steps.pre.outputs.old_id }}" ]; then
            echo "::error::Instance id did not change — replacement did not happen."
            exit 1
          fi

      - name: Wait for SSM agent online on new instance
        run: |
          NEW_ID="${{ steps.newinst.outputs.new_id }}"
          echo "Waiting for SSM agent on $NEW_ID..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$NEW_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM online after ${i} attempts"
              exit 0
            fi
            echo "  Attempt $i/30: status=$STATUS"
            sleep 10
          done
          echo "::error::SSM agent not online after 300s."
          exit 1

      - name: Update container via SSM (cold first boot → litestream restore)
        id: ssmupdate
        run: |
          NEW_ID="${{ steps.newinst.outputs.new_id }}"
          ECR_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}"
          ECR_TAG="${{ env.STAGE }}"
          REGION="${{ env.AWS_REGION }}"
          ACCOUNT="${{ env.EXPECTED_ACCOUNT }}"
          CONTAINER_NAME="${{ env.CONTAINER_NAME }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$NEW_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters "commands=[
              'set -e',
              'echo === Host dir state on COLD boot ===',
              'ls -la /opt/cgiar-ia/synapsis 2>/dev/null || echo NO_HOST_DIR_YET',
              'sudo systemctl enable --now docker || true',
              'sleep 5',
              'aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT.dkr.ecr.$REGION.amazonaws.com',
              'docker pull $ECR_URI:$ECR_TAG',
              'docker stop $CONTAINER_NAME || true',
              'docker rm $CONTAINER_NAME || true',
              'SSM_PREFIX=/cgiar-ia-${{ env.STAGE }}',
              'ANTHROPIC_KEY=\$(aws ssm get-parameter --name \$SSM_PREFIX/anthropic-api-key --with-decryption --query Parameter.Value --output text --region $REGION 2>/dev/null || echo \"\")',
              'mkdir -p /opt/cgiar-ia/synapsis',
              'chown 1000:1000 /opt/cgiar-ia/synapsis 2>/dev/null || true',
              'echo === Host dir immediately before docker run \\(must have NO chat.db\\) ===',
              'ls -la /opt/cgiar-ia/synapsis',
              'docker run -d --name $CONTAINER_NAME --restart always --log-driver=awslogs --log-opt awslogs-region=$REGION --log-opt awslogs-group=/cgiar-ia/${{ env.STAGE }} --log-opt awslogs-stream=$CONTAINER_NAME --log-opt awslogs-create-group=true --log-opt mode=non-blocking --log-opt max-buffer-size=4m -p 7780:7780 -v /opt/cgiar-ia/synapsis:/workspace/.synapsis -e AWS_REGION=$REGION -e LITESTREAM_S3_BUCKET=cgiar-ia-artifacts-$ACCOUNT -e ANTHROPIC_API_KEY=\$ANTHROPIC_KEY -e SYNAPSIS_PORT=7780 -e SYNAPSIS_HOST=0.0.0.0 -e SYNAPSIS_PLATFORM=linux -e PRMS_DB_PATH=/app/data/prdb.sqlite -e SYNAPSIS_MODEL=claude-sonnet-4-6 -e SYNAPSIS_FALLBACK_MODEL=claude-opus-4-8 -e SYNAPSIS_MAX_TURNS=200 -e SYNAPSIS_WORKSPACE=/workspace $ECR_URI:$ECR_TAG',
              'for i in \$(seq 1 20); do if curl -sf http://localhost:7780/api/health; then echo CONTAINER_HEALTHY; break; fi; sleep 3; done',
              'echo === Host dir AFTER restore \\(chat.db should now exist, pulled from S3\\) ===',
              'ls -la /opt/cgiar-ia/synapsis',
              'echo COLD_BOOT_PROOF_COMPLETE'
            ]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command + print output
        run: |
          COMMAND_ID="${{ steps.ssmupdate.outputs.command_id }}"
          NEW_ID="${{ steps.newinst.outputs.new_id }}"
          for i in $(seq 1 40); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$NEW_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "  Poll $i/40: $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "=== STDOUT ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$NEW_ID" \
                --query 'StandardOutputContent' --output text || true
              echo "=== STDERR ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$NEW_ID" \
                --query 'StandardErrorContent' --output text || true
              [ "$STATUS" = "Success" ] && exit 0 || exit 1
            fi
          done
          echo "::error::Timed out waiting for SSM command."
          exit 1

      - name: Summary
        run: |
          echo "PRE-deploy instance (CFN ref): ${{ steps.pre.outputs.old_id }}"
          echo "NEW instance (cold first boot): ${{ steps.newinst.outputs.new_id }}"
