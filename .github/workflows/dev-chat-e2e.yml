name: DEV chat E2E (real questions, encrypted transcript)
# DEV-ONLY, opt-in. A push to the DEV branch that changes .github/dev-e2e-request.json
# asks the deployed DEV app the request's questions as a synthetic researcher
# (dev-chat-e2e.py, same in-container pattern as the Opus 5.5 check / QA smoke).
# The log only shows costs/turns/tool names; full transcripts are encrypted to the
# requester's RSA public key and kept as a 1-day artifact (the repo is public).
on:
  push:
    branches: [feature/innovation-platform-foundation]
    paths: [.github/dev-e2e-request.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: dev-chat-e2e
  cancel-in-progress: false
jobs:
  e2e:
    environment: DEV
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse anything but the DEV branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/feature/innovation-platform-foundation" ]]; then
            echo "::error::DEV branch only"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: eu-central-1
      - name: Ask DEV the questions (synthetic researcher) and fetch the encrypted transcript
        run: |
          python3 -m pip install 'boto3>=1.35,<2'
          python3 - <<'PY'
          import base64, json, os, re, shlex, time, zlib, boto3
          from pathlib import Path
          assert boto3.client('sts').get_caller_identity()['Account'] == '972793825893'
          cf = boto3.client('cloudformation')
          outs = cf.describe_stacks(StackName='cgiar-ia-dev')['Stacks'][0]['Outputs']
          instance = next(o['OutputValue'] for o in outs if o['OutputKey'] == 'InstanceId')
          ssm = boto3.client('ssm')
          req = json.loads(Path('.github/dev-e2e-request.json').read_text())
          blob = '/tmp/ia-e2e-' + os.environ['GITHUB_RUN_ID'] + '.json'
          req['blob'] = blob
          enc_req = base64.b64encode(json.dumps(req).encode()).decode()
          code = base64.b64encode(zlib.compress(Path('.github/scripts/dev-chat-e2e.py').read_bytes(), 9)).decode()
          C = 'cgiar-innovation-analytics'

          def run(cmd, timeout_s):
              cid = ssm.send_command(InstanceIds=[instance], DocumentName='AWS-RunShellScript',
                                     Parameters={'commands': ['set -e', cmd]}, TimeoutSeconds=timeout_s)['Command']['CommandId']
              for _ in range(timeout_s // 5 + 60):
                  time.sleep(5)
                  try:
                      r = ssm.get_command_invocation(CommandId=cid, InstanceId=instance)
                  except ssm.exceptions.InvocationDoesNotExist:
                      continue
                  if r['Status'] in ('Success', 'Failed', 'Cancelled', 'TimedOut'):
                      return r
              raise SystemExit('SSM timed out: ' + cid)

          cmd = ('docker exec -e IA_E2E_REQUEST=' + shlex.quote(enc_req) + ' ' + C + ' python -c '
                 + shlex.quote('import base64,zlib;exec(zlib.decompress(base64.b64decode(' + repr(code) + ')))'))
          r = run(cmd, 3000)
          line = next((l for l in reversed(r['StandardOutputContent'].splitlines()) if l.startswith('{"dev_chat_e2e"')), None)
          print(line or 'no summary line'); print('status', r['Status'])
          if r['Status'] != 'Success' or not line:
              print(r['StandardErrorContent'][-3000:])
              raise SystemExit('E2E failed')
          n = int(run('docker exec ' + C + ' wc -c ' + blob, 120)['StandardOutputContent'].split()[0])
          parts = []
          for i in range(0, n, 20000):
              rr = run('docker exec ' + C + ' python -c ' + shlex.quote(f'import sys;sys.stdout.write(open({blob!r}).read()[{i}:{i+20000}])'), 120)
              parts.append(rr['StandardOutputContent'])
          run('docker exec ' + C + ' rm -f ' + blob, 120)
          data = ''.join(parts); assert len(data) == n, (len(data), n)
          json.loads(data)  # well-formed envelope
          Path('e2e-transcript.enc.json').write_text(data)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('### DEV chat E2E\n\n```json\n' + json.dumps(json.loads(line), indent=1) + '\n```\n')
          failed = json.loads(line)['dev_chat_e2e'].get('checks_failed') or []
          if failed:  # transcript is saved above; the upload step still runs
              raise SystemExit('E2E checks failed: ' + ', '.join(failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-transcript-encrypted
          path: e2e-transcript.enc.json
          retention-days: 1
