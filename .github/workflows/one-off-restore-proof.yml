name: One-off — Delete host chat.db for restore proof

on:
  workflow_dispatch:
  push:
    branches: [feature/innovation-platform-foundation]
    paths:
      - '.github/workflows/one-off-restore-proof.yml'

permissions:
  id-token: write
  contents: read

jobs:
  delete-host-chatdb:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: arn:aws:iam::972793825893:role/cicd/github-actions-cgiar-innovation-analytics-DEV-deploy
          aws-region: eu-central-1
          audience: sts.amazonaws.com

      - name: Backup, delete host chat.db, and restart container via SSM
        id: delete
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0dc2ca3eaa2b73222 \
            --document-name "AWS-RunShellScript" \
            --region eu-central-1 \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "set -ex",
              "TS=$(date +%Y%m%d_%H%M%S)",
              "echo === Backing up chat.db before deletion ===",
              "if [ -f /opt/cgiar-ia/synapsis/chat.db ]; then aws s3 cp /opt/cgiar-ia/synapsis/chat.db s3://cgiar-ia-artifacts-972793825893/chat-backups/pre-restore-proof-${TS}.db --region eu-central-1 && echo BACKUP_OK; else echo NO_FILE_TO_BACKUP; fi",
              "echo === Stopping container so litestream cannot re-replicate the empty DB ===",
              "docker stop cgiar-innovation-analytics || true",
              "echo === Deleting chat.db and WAL/SHM files from bind-mount ===",
              "rm -fv /opt/cgiar-ia/synapsis/chat.db /opt/cgiar-ia/synapsis/chat.db-wal /opt/cgiar-ia/synapsis/chat.db-shm",
              "echo === Listing host dir after deletion ===",
              "ls -la /opt/cgiar-ia/synapsis/ || echo dir_empty_or_missing",
              "echo === Starting container — litestream must now restore chat.db from S3 ===",
              "docker start cgiar-innovation-analytics",
              "echo === Waiting for health ===",
              "for i in $(seq 1 20); do if curl -sf http://localhost:7780/api/health; then echo CONTAINER_HEALTHY; break; fi; sleep 3; done",
              "sleep 3",
              "echo === Host dir after restore ===",
              "ls -la /opt/cgiar-ia/synapsis/ || echo dir_empty_or_missing",
              "echo RESTORE_PROOF_COMPLETE"
            ]' \
            --output text --query 'Command.CommandId')
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM command ID: $COMMAND_ID"

          echo "Waiting for SSM command to complete..."
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0dc2ca3eaa2b73222 \
              --region eu-central-1 \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: Status=$STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            sleep 5
          done

          echo "=== SSM Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0dc2ca3eaa2b73222 \
            --region eu-central-1 \
            --query '[Status, StandardOutputContent, StandardErrorContent]' \
            --output json
