name: Deploy Innovation Analytics

on:
  push:
    branches: [feature/innovation-platform-foundation]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Target environment
        options: [dev, staging, prod]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPO_NAME: cgiar-ia-service
  STACK_NAME_PREFIX: cgiar-ia

  STAGE: >-
    ${{
      inputs.environment
      || (github.ref_name == 'feature/innovation-platform-foundation' && 'dev')
      || (github.ref_name == 'staging' && 'staging')
      || 'prod'
    }}
  ENVIRONMENT: >-
    ${{
      (inputs.environment == 'dev' || (!inputs.environment && github.ref_name == 'feature/innovation-platform-foundation')) && 'DEV'
      || (inputs.environment == 'staging' || (!inputs.environment && github.ref_name == 'staging')) && 'TST'
      || 'PRD'
    }}
  ROLE_ARN: >-
    ${{
      (inputs.environment == 'dev' || (!inputs.environment && github.ref_name == 'feature/innovation-platform-foundation')) && vars.AWS_ROLE_ARN_DEV
      || (inputs.environment == 'staging' || (!inputs.environment && github.ref_name == 'staging')) && vars.AWS_ROLE_ARN_TST
      || vars.AWS_ROLE_ARN_PRD
    }}
  EXPECTED_ACCOUNT: >-
    ${{
      (inputs.environment == 'dev' || (!inputs.environment && github.ref_name == 'feature/innovation-platform-foundation')) && '972793825893'
      || (inputs.environment == 'staging' || (!inputs.environment && github.ref_name == 'staging')) && '053142643230'
      || '207258148366'
    }}

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: >-
      ${{
        (inputs.environment == 'dev' || (!inputs.environment && github.ref_name == 'feature/innovation-platform-foundation')) && 'DEV'
        || (inputs.environment == 'staging' || (!inputs.environment && github.ref_name == 'staging')) && 'TST'
        || 'PRD'
      }}
    permissions:
      id-token: write
      contents: read

    steps:
      # -----------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # AWS Authentication (OIDC)
      # -----------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify target account
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Target: ${{ env.EXPECTED_ACCOUNT }} | Actual: $ACTUAL_ACCOUNT"
          if [[ "$ACTUAL_ACCOUNT" != "${{ env.EXPECTED_ACCOUNT }}" ]]; then
            echo "::error::Account mismatch! Expected ${{ env.EXPECTED_ACCOUNT }}, got $ACTUAL_ACCOUNT"
            exit 1
          fi

      - name: Verify environment-specific SSO configuration
        env:
          SSO_ISSUER: ${{ vars.IA_SSO_ISSUER }}
          SSO_CLIENT: ${{ vars.IA_SSO_CLIENT_ID }}
          SSO_DOMAIN: ${{ vars.IA_SSO_DOMAIN }}
          SSO_ORIGIN: ${{ vars.IA_SSO_ORIGIN }}
          SSO_ADMINS: ${{ vars.IA_SSO_ADMIN_SUBJECTS }}
          INVITED_ENABLED: ${{ vars.IA_INVITED_LOGIN_ENABLED || 'false' }}
        run: |
          python3 .github/scripts/verify-sso-environment.py

      # -----------------------------------------------------------------
      # ECR: Login + ensure repo exists
      # -----------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPO_NAME }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPO_NAME }} \
            --image-scanning-configuration scanOnPush=true

      - name: Download and verify published PRMS snapshot and matching index
        env:
          S3_BUCKET: cgiar-ia-artifacts-${{ env.EXPECTED_ACCOUNT }}
        run: |
          set -euo pipefail
          mkdir -p data/search_index
          aws s3 cp "s3://$S3_BUCKET/prdb.manifest.json" data/prdb.manifest.json
          PREFIX=$(python3 -c 'import json; print(json.load(open("data/prdb.manifest.json"))["s3_prefix"])')
          aws s3 cp "s3://$S3_BUCKET/$PREFIX/prdb.sqlite" data/prdb.sqlite
          aws s3 cp "s3://$S3_BUCKET/$PREFIX/search_index/" data/search_index/ --recursive
          python3 .github/scripts/verify-prms-artifact.py

      # -----------------------------------------------------------------
      # Docker: Build and push image
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.STAGE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:buildcache,mode=max,image-manifest=true
          provenance: false

      # -----------------------------------------------------------------
      # SSM: Store secrets as parameters
      # -----------------------------------------------------------------
      - name: Store secrets in SSM Parameter Store
        run: |
          SSM_PREFIX="/cgiar-ia-${{ env.STAGE }}"

          # Anthropic API Key
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            aws ssm put-parameter \
              --name "$SSM_PREFIX/anthropic-api-key" \
              --value "${{ secrets.ANTHROPIC_API_KEY }}" \
              --type SecureString \
              --overwrite 2>/dev/null || true
          fi

          # OpenAI API Key (voice transcribe + TTS — synapsis/routes/transcribe.py, tts.py)
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            aws ssm put-parameter \
              --name "$SSM_PREFIX/openai-api-key" \
              --value "${{ secrets.OPENAI_API_KEY }}" \
              --type SecureString \
              --overwrite 2>/dev/null || true
          fi

          # JWT signing secret for app-level login (Step 3). Generated once per
          # environment on first deploy and reused thereafter so existing tokens
          # stay valid across redeploys. Never printed.
          if ! aws ssm get-parameter --name "$SSM_PREFIX/jwt-secret" >/dev/null 2>&1; then
            GEN_SECRET=$(openssl rand -hex 32)
            aws ssm put-parameter \
              --name "$SSM_PREFIX/jwt-secret" \
              --value "$GEN_SECRET" \
              --type SecureString \
              --overwrite 2>/dev/null || true
            echo "Generated a new JWT secret for $SSM_PREFIX."
          else
            echo "Reusing existing JWT secret for $SSM_PREFIX."
          fi

      # -----------------------------------------------------------------
      # CloudFormation: Deploy infrastructure
      # -----------------------------------------------------------------
      - name: Clean up stuck stack if needed
        run: |
          STACK_NAME="${{ env.STACK_NAME_PREFIX }}-${{ env.STAGE }}"
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Stack status: $STATUS"
          if [[ "$STATUS" == "REVIEW_IN_PROGRESS" || "$STATUS" == "ROLLBACK_COMPLETE" ]]; then
            echo "Deleting stuck stack..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" || true
            echo "Stack deleted"
          fi

      - name: Deploy CloudFormation stack
        run: |
          STACK_NAME="${{ env.STACK_NAME_PREFIX }}-${{ env.STAGE }}"
          ECR_TAG="${{ env.STAGE }}"

          # Build parameter overrides
          PARAMS="Stage=${{ env.STAGE }}"
          PARAMS="$PARAMS EcrImageTag=$ECR_TAG"
          PARAMS="$PARAMS InstanceType=${{ vars.INSTANCE_TYPE || 't3.large' }}"
          PARAMS="$PARAMS VpcId=${{ vars.VPC_ID }}"
          PARAMS="$PARAMS SubnetId1=${{ vars.SUBNET_ID_1 }}"

          # Only include ALB-related params if ACM cert is configured
          if [ -n "${{ vars.ACM_CERTIFICATE_ARN }}" ]; then
            PARAMS="$PARAMS AcmCertificateArn=${{ vars.ACM_CERTIFICATE_ARN }}"
            PARAMS="$PARAMS SubnetId2=${{ vars.SUBNET_ID_2 }}"
          fi

          # Only include HostedZoneId if explicitly set (empty = DNS records created manually)
          if [ -n "${{ vars.HOSTED_ZONE_ID }}" ]; then
            PARAMS="$PARAMS HostedZoneId=${{ vars.HOSTED_ZONE_ID }}"
          fi

          aws cloudformation deploy \
            --template-file infra/cloudformation.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides $PARAMS \
            --tags \
              Project=cgiar-innovation-analytics \
              Environment=${{ env.STAGE }}

      # -----------------------------------------------------------------
      # EC2: Update container via SSM Run Command
      # -----------------------------------------------------------------
      - name: Get stack outputs
        id: get-outputs
        run: |
          STACK_NAME="${{ env.STACK_NAME_PREFIX }}-${{ env.STAGE }}"

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Instance ID: $INSTANCE_ID"

          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InstancePublicIp'].OutputValue" \
            --output text)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "Public IP: $PUBLIC_IP"

          HAS_ALB=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HasALB'].OutputValue" \
            --output text)
          echo "has_alb=$HAS_ALB" >> "$GITHUB_OUTPUT"
          echo "Has ALB: $HAS_ALB"

          AGENT_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AgentURL'].OutputValue" \
            --output text)
          echo "agent_url=$AGENT_URL" >> "$GITHUB_OUTPUT"
          echo "Agent URL: $AGENT_URL"

          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ALBDnsName'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "ALB DNS: $ALB_DNS"

      - name: Wait for SSM agent (reboot if unresponsive)
        run: |
          INSTANCE_ID="${{ steps.get-outputs.outputs.instance_id }}"
          echo "Waiting for SSM agent on $INSTANCE_ID..."

          # Phase 1: Quick check (60s) - SSM may already be online
          for i in $(seq 1 6); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online after ${i}0s"
              echo "ssm_available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  Attempt $i/6: status=$STATUS"
            sleep 10
          done

          # Phase 2: SSM unresponsive - reboot the EC2 instance
          echo "::warning::SSM agent not online after 60s. Rebooting instance $INSTANCE_ID..."
          aws ec2 reboot-instances --instance-ids "$INSTANCE_ID"
          echo "Reboot command sent. Waiting 60s for instance to restart..."
          sleep 60

          # Phase 3: Wait for SSM after reboot (up to 240s)
          for i in $(seq 1 24); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online after reboot (attempt $i)"
              echo "ssm_available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  Post-reboot attempt $i/24: status=$STATUS"
            sleep 10
          done

          echo "::error::SSM agent not online after reboot + 240s wait."
          echo "ssm_available=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Record DEV users and chat ownership before update
        if: env.STAGE == 'dev'
        env:
          IA_INSTANCE_ID: ${{ steps.get-outputs.outputs.instance_id }}
        run: |
          python3 -m pip install 'boto3>=1.35,<2'
          python3 .github/scripts/sso-continuity.py before

      - name: Update container via SSM
        id: ssm-update
        run: |
          INSTANCE_ID="${{ steps.get-outputs.outputs.instance_id }}"
          ECR_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}"
          ECR_TAG="${{ env.STAGE }}"
          REGION="${{ env.AWS_REGION }}"
          ACCOUNT="${{ env.EXPECTED_ACCOUNT }}"
          CONTAINER_NAME="cgiar-innovation-analytics"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters "commands=[
              'set -e',
              'sudo systemctl enable --now docker || true',
              'sleep 5',
              'aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT.dkr.ecr.$REGION.amazonaws.com',
              'docker pull $ECR_URI:$ECR_TAG',
              'docker stop $CONTAINER_NAME || true',
              'docker rm $CONTAINER_NAME || true',
              'docker image prune -af --filter until=24h || true',
              'SSM_PREFIX=/cgiar-ia-${{ env.STAGE }}',
              'ANTHROPIC_KEY=\$(aws ssm get-parameter --name \$SSM_PREFIX/anthropic-api-key --with-decryption --query Parameter.Value --output text --region $REGION 2>/dev/null || echo \"\")',
              'OPENAI_KEY=\$(aws ssm get-parameter --name \$SSM_PREFIX/openai-api-key --with-decryption --query Parameter.Value --output text --region $REGION 2>/dev/null || echo \"\")',
              'JWT_SECRET=\$(aws ssm get-parameter --name \$SSM_PREFIX/jwt-secret --with-decryption --query Parameter.Value --output text --region $REGION 2>/dev/null || echo \"\")',
              'SELF_SIGNUP=false',
              'mkdir -p /opt/cgiar-ia/synapsis',
              'chown 1000:1000 /opt/cgiar-ia/synapsis 2>/dev/null || true',
              'mkdir -p /opt/cgiar-ia/workspace-files/{uploads,outputs,exports,analysis}',
              'chown -R 1000:1000 /opt/cgiar-ia/workspace-files 2>/dev/null || true',
              'docker run -d --name $CONTAINER_NAME --restart always --log-driver=awslogs --log-opt awslogs-region=$REGION --log-opt awslogs-group=/cgiar-ia/${{ env.STAGE }} --log-opt awslogs-stream=$CONTAINER_NAME --log-opt awslogs-create-group=true --log-opt mode=non-blocking --log-opt max-buffer-size=4m -p 7780:7780 -v /opt/cgiar-ia/synapsis:/workspace/.synapsis -v /opt/cgiar-ia/workspace-files/uploads:/workspace/uploads -v /opt/cgiar-ia/workspace-files/outputs:/workspace/outputs -v /opt/cgiar-ia/workspace-files/exports:/workspace/exports -v /opt/cgiar-ia/workspace-files/analysis:/workspace/analysis -e AWS_REGION=$REGION -e LITESTREAM_S3_BUCKET=cgiar-ia-artifacts-$ACCOUNT -e ANTHROPIC_API_KEY=\$ANTHROPIC_KEY -e OPENAI_API_KEY=\$OPENAI_KEY -e IA_AUTH_DISABLED=false -e IA_JWT_SECRET=\$JWT_SECRET -e IA_SELF_SIGNUP=\$SELF_SIGNUP -e IA_PASSWORD_LOGIN_ENABLED=false -e IA_INVITED_LOGIN_ENABLED=${{ vars.IA_INVITED_LOGIN_ENABLED || 'false' }} -e IA_SSO_ENABLED=true -e IA_SSO_ISSUER=${{ vars.IA_SSO_ISSUER }} -e IA_SSO_CLIENT_ID=${{ vars.IA_SSO_CLIENT_ID }} -e IA_SSO_DOMAIN=${{ vars.IA_SSO_DOMAIN }} -e IA_SSO_ORIGIN=${{ vars.IA_SSO_ORIGIN }} -e IA_SSO_ADMIN_SUBJECTS=${{ vars.IA_SSO_ADMIN_SUBJECTS }} -e IA_VOICE_ENABLED=${{ env.STAGE == 'dev' && 'true' || 'false' }} -e SYNAPSIS_PORT=7780 -e SYNAPSIS_HOST=0.0.0.0 -e SYNAPSIS_PLATFORM=linux -e PRMS_DB_PATH=/app/data/prdb.sqlite -e SYNAPSIS_MODEL=claude-sonnet-5 -e SYNAPSIS_FALLBACK_MODEL=claude-opus-5 -e SYNAPSIS_AVAILABLE_MODELS=\"claude-sonnet-5,claude-opus-5,claude-fable-5-1,claude-sonnet-4-6,claude-opus-4-8[1m]\" -e SYNAPSIS_MAX_TURNS=200 -e SYNAPSIS_WORKSPACE=/workspace $ECR_URI:$ECR_TAG',
              'for i in \$(seq 1 15); do if curl -sf http://localhost:7780/api/health; then echo \"Container healthy\"; exit 0; fi; sleep 2; done; echo \"Health check timed out\"; exit 1'
            ]" \
            --query "Command.CommandId" --output text 2>&1) || {
              echo "::error::SSM send-command failed."
              echo "ssm_sent=false" >> "$GITHUB_OUTPUT"
              exit 1
            }

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "ssm_sent=true" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command completion
        if: steps.ssm-update.outputs.ssm_sent == 'true'
        run: |
          COMMAND_ID="${{ steps.ssm-update.outputs.command_id }}"
          INSTANCE_ID="${{ steps.get-outputs.outputs.instance_id }}"

          for i in $(seq 1 36); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            echo "  Poll $i/36: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Container update succeeded!"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "::warning::SSM command $STATUS - checking output for details"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '[StandardOutputContent, StandardErrorContent]' --output text || true
              echo "::error::SSM update failed."
              exit 1
            fi
          done

          echo "::error::Timed out waiting for SSM command."
          exit 1

      # -----------------------------------------------------------------
      # Health check (adapts to ALB vs direct HTTP mode)
      # -----------------------------------------------------------------
      - name: Verify DEV users and chat ownership after update
        if: env.STAGE == 'dev'
        env:
          IA_INSTANCE_ID: ${{ steps.get-outputs.outputs.instance_id }}
        run: python3 .github/scripts/sso-continuity.py after

      - name: Final health check
        run: |
          HAS_ALB="${{ steps.get-outputs.outputs.has_alb }}"
          AGENT_URL="${{ steps.get-outputs.outputs.agent_url }}"
          ALB_DNS="${{ steps.get-outputs.outputs.alb_dns }}"
          PUBLIC_IP="${{ steps.get-outputs.outputs.public_ip }}"

          if [ "$HAS_ALB" = "true" ]; then
            # Primary: custom domain; Fallback: ALB DNS directly (skip cert verify)
            HEALTH_URL="$AGENT_URL/api/health"
            FALLBACK_URL="https://$ALB_DNS/api/health"
            echo "Checking ALB endpoint: $HEALTH_URL (fallback: $FALLBACK_URL)"
          else
            HEALTH_URL="http://$PUBLIC_IP:7780/api/health"
            FALLBACK_URL=""
            echo "Checking direct EC2 endpoint: $HEALTH_URL"
          fi

          echo "Waiting for service to become healthy..."
          for i in $(seq 1 20); do
            # Try primary URL first
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed! Service is live at $AGENT_URL"
              exit 0
            fi
            # Try fallback (ALB DNS directly, -k skips cert mismatch)
            if [ -n "$FALLBACK_URL" ]; then
              HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 "$FALLBACK_URL" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "::warning::Custom domain not reachable yet, but ALB endpoint is healthy."
                echo "Health check passed via ALB fallback! Service is live."
                exit 0
              fi
            fi
            echo "  Attempt $i/20: HTTP $HTTP_CODE"
            sleep 15
          done

          echo "::error::Health check failed after 5 minutes."
          exit 1

      - name: Verify deployed version
        run: |
          AGENT_URL="${{ steps.get-outputs.outputs.agent_url }}"
          ALB_DNS="${{ steps.get-outputs.outputs.alb_dns }}"
          EXPECTED="${{ github.sha }}"

          # Use whichever endpoint responds
          for i in $(seq 1 10); do
            RUNNING=$(curl -sf "$AGENT_URL/api/health" 2>/dev/null | jq -r '.git_sha // "unknown"')
            if [ "$RUNNING" = "unknown" ] && [ -n "$ALB_DNS" ]; then
              RUNNING=$(curl -skf "https://$ALB_DNS/api/health" 2>/dev/null | jq -r '.git_sha // "unknown"')
            fi
            if [ "$RUNNING" = "$EXPECTED" ]; then
              echo "Verified: running commit matches deployed commit $EXPECTED"
              exit 0
            fi
            echo "  Attempt $i/10: running=$RUNNING expected=$EXPECTED"
            sleep 15
          done
          echo "::warning::Version mismatch (Running=$RUNNING Expected=$EXPECTED). This may be expected if git_sha is not set in health response."
          echo "Proceeding anyway — container is running."
