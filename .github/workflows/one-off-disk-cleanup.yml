name: One-off Disk Cleanup (dev EC2)

# Manual-only one-off operation: SSM into the dev EC2 instance and run
# `docker system prune -f` to free disk space, then print `df -h /`.
# Uses the same OIDC auth as the main deploy workflow (DEV deploy role,
# account 972793825893, eu-central-1).

on:
  workflow_dispatch:
  # NOTE: workflow_dispatch only works once a workflow lives on the default
  # branch (main). This file lives on the feature branch, so we also trigger
  # on push -- scoped to ONLY this workflow file path so it never fires on
  # unrelated feature-branch pushes (deploys are handled by deploy.yml).
  push:
    branches: [feature/innovation-platform-foundation]
    paths:
      - .github/workflows/one-off-disk-cleanup.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  INSTANCE_ID: i-0cddb05bba781e6cd
  EXPECTED_ACCOUNT: "972793825893"

jobs:
  cleanup:
    name: Disk cleanup on dev EC2
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify target account
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Target: ${{ env.EXPECTED_ACCOUNT }} | Actual: $ACTUAL_ACCOUNT"
          if [[ "$ACTUAL_ACCOUNT" != "${{ env.EXPECTED_ACCOUNT }}" ]]; then
            echo "::error::Account mismatch! Expected ${{ env.EXPECTED_ACCOUNT }}, got $ACTUAL_ACCOUNT"
            exit 1
          fi

      - name: Send SSM disk cleanup command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters 'commands=["echo ===BEFORE===","df -h /","docker system prune -f","echo ===AFTER===","df -h /"]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $CMD_ID"

      - name: Wait for SSM command and print output
        run: |
          CMD_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"

          for i in $(seq 1 20); do
            sleep 5
            RESULT=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output json 2>/dev/null || echo '["Pending","",""]')

            STATUS=$(echo "$RESULT" | jq -r '.[0]')
            echo "Poll $i/20: status=$STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "===== STDOUT ====="
              echo "$RESULT" | jq -r '.[1]'
              echo "===== STDERR ====="
              echo "$RESULT" | jq -r '.[2]'
              echo "Disk cleanup succeeded."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "===== STDOUT ====="
              echo "$RESULT" | jq -r '.[1]'
              echo "===== STDERR ====="
              echo "$RESULT" | jq -r '.[2]'
              echo "::error::SSM disk cleanup command $STATUS"
              exit 1
            fi
          done

          echo "::error::Timed out waiting for SSM disk cleanup command."
          exit 1
