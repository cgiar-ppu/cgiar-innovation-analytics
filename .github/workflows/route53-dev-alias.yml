name: Create Route53 Dev Alias (One-Off)

on:
  workflow_dispatch:
    inputs:
      alb_dns_name:
        description: >-
          ALB the dev host aliases to. Default = the shared non-prod ALB of the dev account
          (AWS cost sprint E5, Nov 2026). Rollback during a cut-over: the old cgiar-ia-dev ALB DNS name.
        required: true
        default: syn-ingress-nonprod-2010089379.eu-central-1.elb.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  create-route53-record:
    runs-on: ubuntu-latest
    environment: MGMT
    steps:
      - name: Configure AWS credentials (ai-sandbox MGMT role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919959486181:role/cicd/github-actions-cgiar-innovation-analytics-MGMT-deploy
          aws-region: eu-central-1

      - name: Create A alias record for dev URL
        env:
          ALB_DNS: ${{ inputs.alb_dns_name }}
        run: |
          case "$ALB_DNS" in *.eu-central-1.elb.amazonaws.com) ;; *) echo "::error::not an eu-central-1 ALB DNS name"; exit 1 ;; esac
          aws route53 change-resource-record-sets \
            --hosted-zone-id Z079841559W4HJ5A3Q2Y \
            --change-batch '{
              "Changes": [{
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "innovation-analytics-dev.synapsis-analytics.com",
                  "Type": "A",
                  "AliasTarget": {
                    "HostedZoneId": "Z215JYRZR1TBD5",
                    "DNSName": "'"$ALB_DNS"'",
                    "EvaluateTargetHealth": true
                  }
                }
              }]
            }'
          echo "Route53 UPSERT submitted successfully"

      - name: Verify record exists
        run: |
          aws route53 list-resource-record-sets \
            --hosted-zone-id Z079841559W4HJ5A3Q2Y \
            --query "ResourceRecordSets[?Name=='innovation-analytics-dev.synapsis-analytics.com.']" \
            --output json
