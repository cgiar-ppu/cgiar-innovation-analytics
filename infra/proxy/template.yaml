AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Synapsis HTTPS reverse proxy — tiny EC2 with Nginx + Let's Encrypt + Elastic IP.
  Accepts public HTTPS traffic at synaptic.synapsis-analytics.com and forwards it
  through an SSH reverse tunnel to a local Mac. The tunnel auto-resolves the proxy
  IP from CloudFormation, so EIP changes are picked up without manual intervention.

# ============================================================================
# Parameters
# ============================================================================
Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the proxy

  DomainName:
    Type: String
    Default: synaptic.synapsis-analytics.com
    Description: FQDN for the proxy

  HostedZoneId:
    Type: String
    Default: Z079841559W4HJ5A3Q2Y
    Description: Route 53 hosted zone ID for synapsis-analytics.com

  CertEmail:
    Type: String
    Default: admin@synapsis-analytics.com
    Description: Email for Let's Encrypt certificate registration

  SSHPublicKey:
    Type: String
    Default: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDi9j7DUJY4Az85NbNgkbleeKKfACh1GOy+enj38dPyk synapsis-proxy-tunnel
    Description: SSH public key for tunnel access from local Mac

# ============================================================================
# Resources
# ============================================================================
Resources:

  # --------------------------------------------------------------------------
  # Networking — minimal VPC with one public subnet
  # --------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.99.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: synapsis-proxy-vpc

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.99.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: synapsis-proxy-subnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: synapsis-proxy-igw

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # --------------------------------------------------------------------------
  # Security Group — SSH + HTTP + HTTPS only
  # --------------------------------------------------------------------------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Synapsis proxy - SSH, HTTP, HTTPS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH for reverse tunnel
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP - LetsEncrypt ACME and redirect
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Name
          Value: synapsis-proxy-sg

  # --------------------------------------------------------------------------
  # IAM — minimal role with SSM for management
  # --------------------------------------------------------------------------
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: synapsis-proxy-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: route53-dns-challenge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                Resource:
                  - !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
                  - 'arn:aws:route53:::change/*'
              - Effect: Allow
                Action:
                  - route53:ListHostedZones
                  - route53:ListHostedZonesByName
                Resource: '*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # --------------------------------------------------------------------------
  # SSH Key Pair — imported from local Mac public key
  # --------------------------------------------------------------------------
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: synapsis-proxy-key
      PublicKeyMaterial: !Ref SSHPublicKey
      Tags:
        - Key: Name
          Value: synapsis-proxy-key

  # --------------------------------------------------------------------------
  # EC2 Instance — Nginx + Let's Encrypt + SSH tunnel endpoint
  # --------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - SubnetRouteTableAssociation
    Properties:
      KeyName: !Ref KeyPair
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: synapsis-proxy
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -uxo pipefail
          exec > /var/log/synapsis-proxy-setup.log 2>&1

          echo "=== Synapsis Proxy Setup (v3 — full production) ==="
          date

          # ----------------------------------------------------------------
          # Variables from CloudFormation parameters
          # All subsequent bash code uses $VAR (no braces) so that
          # CloudFormation !Sub does not interfere.
          # ----------------------------------------------------------------
          DOMAIN="${DomainName}"
          CERT_EMAIL="${CertEmail}"
          SSH_PUBLIC_KEY="${SSHPublicKey}"

          # ----------------------------------------------------------------
          # 1. Install packages (with retry)
          # ----------------------------------------------------------------
          # NOTE: Do NOT use "cloud-init status --wait" here — this script
          # IS executed by cloud-init, so waiting for it creates a deadlock.
          sleep 5  # brief pause to let package manager initialize

          for attempt in 1 2 3 4 5; do
            echo "dnf install attempt $attempt..."
            if dnf install -y nginx python3 python3-pip bind-utils jq httpd-tools; then
              echo "Packages installed successfully"
              break
            fi
            echo "dnf locked, waiting 15s..."
            sleep 15
          done

          # ----------------------------------------------------------------
          # 2. Configure SSH for reverse tunnel
          # ----------------------------------------------------------------
          if ! grep -q "^GatewayPorts clientspecified" /etc/ssh/sshd_config; then
            sed -i 's/^#GatewayPorts.*/GatewayPorts clientspecified/' /etc/ssh/sshd_config
            grep -q "^GatewayPorts" /etc/ssh/sshd_config || \
              echo "GatewayPorts clientspecified" >> /etc/ssh/sshd_config
          fi

          if ! grep -q "^ClientAliveInterval" /etc/ssh/sshd_config; then
            echo "ClientAliveInterval 30" >> /etc/ssh/sshd_config
            echo "ClientAliveCountMax 3" >> /etc/ssh/sshd_config
          fi

          systemctl restart sshd

          # ----------------------------------------------------------------
          # 3. Add SSH public key for tunnel user
          # ----------------------------------------------------------------
          mkdir -p /home/ec2-user/.ssh
          chmod 700 /home/ec2-user/.ssh

          PUB_KEY="$SSH_PUBLIC_KEY"
          grep -qF "$PUB_KEY" /home/ec2-user/.ssh/authorized_keys 2>/dev/null || \
            echo "$PUB_KEY" >> /home/ec2-user/.ssh/authorized_keys

          chmod 600 /home/ec2-user/.ssh/authorized_keys
          chown -R ec2-user:ec2-user /home/ec2-user/.ssh

          # ----------------------------------------------------------------
          # 4. Create .htpasswd for basic auth
          # ----------------------------------------------------------------
          htpasswd -bc /etc/nginx/.htpasswd smith '31415Pi-'

          # ----------------------------------------------------------------
          # 5. Install certbot-dns-route53 in a Python venv
          # ----------------------------------------------------------------
          python3 -m venv /opt/certbot-dns
          /opt/certbot-dns/bin/pip install --upgrade pip
          /opt/certbot-dns/bin/pip install certbot certbot-dns-route53

          # ----------------------------------------------------------------
          # 6. Inject http-block directives into nginx.conf
          #    (gzip, proxy cache, upload limit)
          # ----------------------------------------------------------------
          HTTP_BLOCK_DIRECTIVES='
              # --- Synapsis proxy http-block additions ---

              # Increase hash bucket size for long map keys (64-char auth tokens)
              map_hash_bucket_size 128;

              # Three-tier auth: IP allowlist + token cookie + Basic Auth fallback
              # To add per-person tokens, see instructions in nginx-http.conf
              map $cookie_synaptic_auth $cookie_valid {
                  "c26155fc3601a74bf97c71cc161f5e9de2b1155420d5ec6f7861acd8058bdc1b"  1;    # Team — permanent
                  # "PASTE_TOKEN_HERE"                                                  1;    # Guest name — reason
                  default                                                               0;
              }

              geo $ip_whitelisted {
                  default         0;
                  85.87.216.195/32  1;    # Smith — home network
              }

              map "$ip_whitelisted:$cookie_valid" $synaptic_auth_realm {
                  "1:0"   off;
                  "1:1"   off;
                  "0:1"   off;
                  default "Synaptic";
              }

              client_max_body_size 50m;

              proxy_cache_path /var/cache/nginx/proxy
                  levels=1:2
                  keys_zone=tunnel_cache:10m
                  max_size=500m
                  inactive=7d
                  use_temp_path=off;

              gzip on;
              gzip_vary on;
              gzip_proxied any;
              gzip_comp_level 6;
              gzip_min_length 256;
              gzip_types text/plain text/css text/javascript application/javascript
                         application/json application/xml image/svg+xml
                         application/x-javascript text/xml application/xhtml+xml
                         application/vnd.ms-fontobject font/opentype;
              # --- end Synapsis additions ---
          '

          # Insert after the first "http {" line in nginx.conf
          # (Using python3 because sed cannot reliably insert multiline text)
          if ! grep -q "Synapsis proxy http-block additions" /etc/nginx/nginx.conf; then
            python3 -c "
          p='/etc/nginx/nginx.conf'
          with open(p) as f: c=f.read()
          c=c.replace('http {','http {'+'''$HTTP_BLOCK_DIRECTIVES''',1)
          with open(p,'w') as f: f.write(c)
          "
          fi

          # ----------------------------------------------------------------
          # 7. Prepare directories and remove defaults
          # ----------------------------------------------------------------
          rm -f /etc/nginx/conf.d/default.conf
          mkdir -p /var/cache/nginx/proxy /var/www/html
          chown nginx:nginx /var/cache/nginx/proxy

          # ----------------------------------------------------------------
          # 8. Write temporary HTTP-only nginx config (for DNS check)
          # ----------------------------------------------------------------
          cat > /etc/nginx/conf.d/synaptic.conf << 'NGINXEOF'
          server {
              listen 80;
              server_name _;
              location / {
                  return 200 'OK - waiting for certificate';
                  add_header Content-Type text/plain;
              }
          }
          NGINXEOF

          nginx -t
          systemctl enable nginx
          systemctl start nginx

          # ----------------------------------------------------------------
          # 9. Wait for DNS propagation
          # ----------------------------------------------------------------
          MAX_WAIT=60
          ATTEMPT=0

          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          MY_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
            http://169.254.169.254/latest/meta-data/public-ipv4)
          echo "Instance public IP: $MY_IP"

          while [ $ATTEMPT -lt $MAX_WAIT ]; do
            RESOLVED=$(dig +short "$DOMAIN" @8.8.8.8 2>/dev/null | tail -1)
            echo "Attempt $((ATTEMPT+1)): dns_resolved=$RESOLVED expected=$MY_IP"

            if [ -n "$RESOLVED" ] && [ "$RESOLVED" = "$MY_IP" ]; then
              echo "DNS resolved correctly to $MY_IP"
              break
            fi

            sleep 10
            ATTEMPT=$((ATTEMPT+1))
          done

          if [ "$RESOLVED" != "$MY_IP" ]; then
            echo "WARNING: DNS did not resolve after $MAX_WAIT attempts. Attempting certbot anyway."
          fi

          # ----------------------------------------------------------------
          # 10. Request wildcard certificate via DNS-01 challenge
          # ----------------------------------------------------------------
          CERT_OK=false
          for i in 1 2 3; do
            echo "Certbot DNS-01 attempt $i..."
            if /opt/certbot-dns/bin/certbot certonly --dns-route53 \
              -d "$DOMAIN" -d "*.$DOMAIN" \
              --cert-name synaptic-wildcard \
              --non-interactive --agree-tos --email "$CERT_EMAIL"; then
              CERT_OK=true
              echo "Wildcard certificate obtained successfully!"
              break
            fi
            echo "Certbot attempt $i failed, retrying in 30s..."
            sleep 30
          done

          if [ "$CERT_OK" = "false" ]; then
            echo "ERROR: Failed to obtain wildcard certificate after 3 attempts"
            echo "Nginx will remain on the temporary HTTP config. Run certbot manually."
            echo "=== Setup INCOMPLETE ==="
            date
            exit 1
          fi

          # ----------------------------------------------------------------
          # 11. Deploy the full production nginx site config
          #     Single-quoted heredoc: bash does not expand $host etc.
          #     No dollar-brace patterns in the nginx config, so !Sub ignores it.
          # ----------------------------------------------------------------
          cat > /etc/nginx/conf.d/synaptic.conf << 'NGINXEOF'
          # =====================================================================
          # Main app — synaptic.synapsis-analytics.com → localhost:7777
          # =====================================================================
          server {
              listen 80;
              server_name synaptic.synapsis-analytics.com *.synaptic.synapsis-analytics.com;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              http2 on;
              server_name synaptic.synapsis-analytics.com;

              ssl_certificate /etc/letsencrypt/live/synaptic-wildcard/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/synaptic-wildcard/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;

              auth_basic $synaptic_auth_realm;
              auth_basic_user_file /etc/nginx/.htpasswd;

              location /.well-known/acme-challenge/ {
                  auth_basic off;
                  root /var/www/html;
              }

              # Token-based auth — see nginx-http.conf and synaptic.conf for full instructions
              # on adding per-person tokens with custom expiry times
              location = /auth {
                  auth_basic off;

                  # Team — permanent token (90-day cookie)
                  if ($arg_token = "c26155fc3601a74bf97c71cc161f5e9de2b1155420d5ec6f7861acd8058bdc1b") {
                      add_header Set-Cookie "synaptic_auth=c26155fc3601a74bf97c71cc161f5e9de2b1155420d5ec6f7861acd8058bdc1b; Path=/; Max-Age=7776000; Secure; HttpOnly; SameSite=Lax; Domain=.synaptic.synapsis-analytics.com" always;
                      return 302 /;
                  }

                  # Per-person tokens — duplicate the block above, replace token + Max-Age
                  # Max-Age reference: 7776000=90d, 2592000=30d, 604800=7d, 86400=1d

                  return 403;
              }

              # Static assets — cache aggressively (Vite hashed filenames = safe to cache forever)
              location /assets/ {
                  proxy_pass http://127.0.0.1:7777;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  # Cache static assets on EC2 — only fetched through tunnel once
                  proxy_cache tunnel_cache;
                  proxy_cache_valid 200 7d;
                  proxy_cache_key $uri;
                  proxy_cache_use_stale error timeout updating;
                  add_header X-Cache-Status $upstream_cache_status;

                  proxy_connect_timeout 10s;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }

              # Favicon and other static files
              location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
                  proxy_pass http://127.0.0.1:7777;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;

                  proxy_cache tunnel_cache;
                  proxy_cache_valid 200 7d;
                  proxy_cache_key $uri;
                  proxy_cache_use_stale error timeout updating;
                  add_header X-Cache-Status $upstream_cache_status;
              }

              # Browser permissions — explicitly allow microphone for voice-to-text
              add_header Permissions-Policy "microphone=(self)" always;

              # API and dynamic routes — no cache
              location / {
                  proxy_pass http://127.0.0.1:7777;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
                  proxy_request_buffering off;
              }

              location /ws/ {
                  proxy_pass http://127.0.0.1:7777;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }
          }

          # =====================================================================
          # Port-based subdomains — p{PORT}.synaptic.synapsis-analytics.com
          #
          # All backends serve plain HTTP. SSL is terminated at nginx (Let's Encrypt).
          # nginx proxies to localhost backends over HTTP via the SSH tunnel.
          #
          # Allowed port ranges:
          #   5173-5178  (Vite dev servers)
          #   4173-4178  (Vite preview)
          #   3000-3010  (Node/React dev servers)
          #   7777-7790  (Synapsis agent apps)
          #   8000-8100  (Generic dev servers)
          # =====================================================================
          server {
              listen 443 ssl;
              http2 on;
              server_name ~^p(?<port>\d+)\.synaptic\.synapsis-analytics\.com$;

              ssl_certificate /etc/letsencrypt/live/synaptic-wildcard/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/synaptic-wildcard/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;

              # Three-tier auth inherited from $synaptic_auth_realm
              set $auth_realm $synaptic_auth_realm;
              if ($port ~ "^(517[3-8])$")     { set $auth_realm off; }
              if ($port ~ "^(417[3-8])$")     { set $auth_realm off; }
              if ($port ~ "^(300[0-9]|3010)$") { set $auth_realm off; }
              auth_basic $auth_realm;
              auth_basic_user_file /etc/nginx/.htpasswd;

              set $port_ok 0;
              set $backend_proto http;

              if ($port ~ "^(517[3-8])$")     { set $port_ok 1; }
              if ($port ~ "^(417[3-8])$")     { set $port_ok 1; }
              if ($port ~ "^(300[0-9]|3010)$") { set $port_ok 1; }
              if ($port ~ "^(777[7-9]|778[0-9]|7790)$") { set $port_ok 1; }
              if ($port ~ "^(80[0-9][0-9]|8100)$") { set $port_ok 1; }

              # Static assets — cache on EC2
              location /assets/ {
                  if ($port_ok = 0) { return 403; }

                  proxy_pass $backend_proto://127.0.0.1:$port;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_cache tunnel_cache;
                  proxy_cache_valid 200 7d;
                  proxy_cache_key $port$uri;
                  proxy_cache_use_stale error timeout updating;
                  add_header X-Cache-Status $upstream_cache_status;

                  proxy_connect_timeout 5s;
                  proxy_read_timeout 300s;
              }

              location / {
                  if ($port_ok = 0) { return 403; }

                  proxy_pass $backend_proto://127.0.0.1:$port;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }

              location /ws {
                  if ($port_ok = 0) { return 403; }

                  proxy_pass $backend_proto://127.0.0.1:$port;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }
          }
          NGINXEOF

          # ----------------------------------------------------------------
          # 12. Validate and reload nginx with production config
          # ----------------------------------------------------------------
          nginx -t
          systemctl reload nginx
          echo "Production nginx config deployed and reloaded."

          # ----------------------------------------------------------------
          # 13. Set up certbot renewal with systemd override
          #     The system certbot does not have dns-route53 plugin,
          #     so we override the service to use the venv certbot.
          # ----------------------------------------------------------------
          mkdir -p /etc/systemd/system/certbot-renew.service.d/
          cat > /etc/systemd/system/certbot-renew.service.d/override.conf << 'SVCEOF'
          [Service]
          ExecStart=
          ExecStart=/opt/certbot-dns/bin/certbot renew --noninteractive
          SVCEOF

          systemctl daemon-reload
          systemctl enable certbot-renew.timer
          systemctl start certbot-renew.timer

          # ----------------------------------------------------------------
          # 14. Add deploy hook for nginx reload after cert renewal
          # ----------------------------------------------------------------
          mkdir -p /etc/letsencrypt/renewal-hooks/deploy/
          cat > /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh << 'HOOKEOF'
          #!/bin/bash
          systemctl reload nginx
          HOOKEOF
          chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh

          # ----------------------------------------------------------------
          # 15. Final status
          # ----------------------------------------------------------------
          echo "=== Setup complete ==="
          echo "Domain: $DOMAIN"
          echo "Public IP: $MY_IP"
          echo "Nginx status: $(systemctl is-active nginx)"
          echo "Certificate: $(ls -la /etc/letsencrypt/live/synaptic-wildcard/ 2>/dev/null || echo 'NOT FOUND')"
          echo "Certbot renewal timer: $(systemctl is-active certbot-renew.timer 2>/dev/null || echo 'NOT ACTIVE')"
          echo "SSH config: GatewayPorts=$(grep GatewayPorts /etc/ssh/sshd_config | head -1)"
          date

  # --------------------------------------------------------------------------
  # Elastic IP — static IP that survives instance replacement
  # --------------------------------------------------------------------------
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: synapsis-proxy-eip

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      AllocationId: !GetAtt ElasticIP.AllocationId

  # --------------------------------------------------------------------------
  # Route 53 — A record pointing to the Elastic IP (static)
  # --------------------------------------------------------------------------
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: '60'
      ResourceRecords:
        - !Ref ElasticIP

  WildcardDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '*.${DomainName}'
      Type: A
      TTL: '60'
      ResourceRecords:
        - !Ref ElasticIP

# ============================================================================
# Outputs
# ============================================================================
Outputs:
  ProxyPublicIP:
    Description: Static Elastic IP of the proxy (persists across redeployments)
    Value: !Ref ElasticIP

  ProxyURL:
    Description: Public HTTPS URL
    Value: !Sub 'https://${DomainName}'

  SSHTunnelCommand:
    Description: Run this on your Mac to establish the reverse tunnel
    Value: !Sub
      - >-
        autossh -M 0 -N
        -o ServerAliveInterval=30
        -o ServerAliveCountMax=3
        -o StrictHostKeyChecking=accept-new
        -o ExitOnForwardFailure=yes
        -R 127.0.0.1:7777:127.0.0.1:7777
        -i ~/.ssh/synapsis-proxy
        ec2-user@${IP}
      - IP: !Ref ElasticIP

  InstanceId:
    Description: EC2 instance ID (for debugging via SSM)
    Value: !Ref Instance
