# =====================================================================
# Nginx http-block additions for the Synapsis proxy
#
# These directives should be added to the http {} block in nginx.conf
# on the EC2 proxy instance. They enable:
#   - Three-tier authentication (IP allowlist + token cookie + Basic Auth)
#   - 50 MB upload limit (voice recordings, file uploads)
#   - Proxy cache for tunnel-served static assets
#   - Gzip compression for text-based assets
# =====================================================================

# -----------------------------------------------------------------------
# Three-tier authentication: IP allowlist → token cookie → Basic Auth
#
# Tier 1: Known team IPs bypass all auth (zero friction)
# Tier 2: Token bookmark sets a 90-day cookie (mobile-friendly)
# Tier 3: Everyone else gets a Basic Auth prompt (external sharing)
# -----------------------------------------------------------------------

# Increase hash bucket size for long map keys (64-char auth tokens)
map_hash_bucket_size 128;

# 1. Check if the request carries a valid auth cookie
#
# -----------------------------------------------------------------------
# PER-PERSON TOKENS (pre-signed URLs)
#
# To grant individual access, generate a unique token per person:
#   openssl rand -hex 32
#
# Then add each token as a new line in this map block. The cookie value
# set by the /auth endpoint must match a line here to be accepted.
#
# To revoke someone's access: remove their line and reload Nginx:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Each person gets their own bookmark URL:
#   https://synaptic.synapsis-analytics.com/auth?token=THEIR_TOKEN
#
# You must ALSO add a matching entry in the /auth location block in
# synaptic.conf (and template.yaml) so the token sets a cookie.
# See the "Per-person token entries" section there.
#
# Example — adding a guest with a 24-hour cookie:
#   1. Generate token:  openssl rand -hex 32  →  abc123...
#   2. Add here:        "abc123..."  1;  # Guest — Client A
#   3. Add /auth entry in synaptic.conf (see instructions there)
#   4. Send them: https://synaptic.synapsis-analytics.com/auth?token=abc123...
#   5. To revoke: remove both entries + reload Nginx
# -----------------------------------------------------------------------
map $cookie_synaptic_auth $cookie_valid {
    "c26155fc3601a74bf97c71cc161f5e9de2b1155420d5ec6f7861acd8058bdc1b"  1;    # Team — permanent (90-day cookie)

    # --- Per-person token entries (uncomment and add as needed) ---
    # "PASTE_TOKEN_HERE"                                                  1;    # Guest name — reason/expiry
    # "PASTE_TOKEN_HERE"                                                  1;    # Guest name — reason/expiry

    default                                                               0;
}

# 2. Check if the client IP is in the team allowlist
geo $ip_whitelisted {
    default         0;
    85.87.216.195/32  1;    # Smith — home network (all devices)
    # Add more team IPs below, one per line:
    # x.x.x.x/32     1;    # Team member name — location
}

# 3. Combine: if EITHER cookie OR IP matches → skip auth, else → prompt
map "$ip_whitelisted:$cookie_valid" $synaptic_auth_realm {
    "1:0"   off;              # IP whitelisted, no cookie
    "1:1"   off;              # IP whitelisted + cookie (both match)
    "0:1"   off;              # Cookie valid, unknown IP (mobile on cellular)
    default "Synaptic";       # Neither → Basic Auth prompt
}

# Upload size limit — required for voice-to-text audio recordings
# Without this, nginx returns HTTP 413 for recordings > 1 MB (the default)
client_max_body_size 50m;

# Proxy cache for tunnel-served static assets
# Static assets (JS/CSS/fonts) are cached on EC2 after the first request,
# so subsequent loads skip the SSH tunnel entirely (~0.2s vs ~5s)
proxy_cache_path /var/cache/nginx/proxy
    levels=1:2
    keys_zone=tunnel_cache:10m
    max_size=500m
    inactive=7d
    use_temp_path=off;

# Gzip compression — critical for tunnel performance
# Reduces JS/CSS payload 3-5x before sending to the browser
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml image/svg+xml
           application/x-javascript text/xml application/xhtml+xml
           application/vnd.ms-fontobject font/opentype;
