# =====================================================================
# Main app — synaptic.synapsis-analytics.com → localhost:7777
# =====================================================================
server {
    listen 80;
    server_name synaptic.synapsis-analytics.com *.synaptic.synapsis-analytics.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name synaptic.synapsis-analytics.com;

    ssl_certificate /etc/letsencrypt/live/synaptic-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synaptic-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic $synaptic_auth_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Token-based auth endpoint — sets a cookie then redirects to /
    # Mobile bookmark URL: https://synaptic.synapsis-analytics.com/auth?token=SECRET
    #
    # -------------------------------------------------------------------
    # HOW TO ADD PER-PERSON TOKENS
    #
    # Each token needs TWO things:
    #   1. A line in the map block in nginx-http.conf (so the cookie is recognized)
    #   2. An if-block here (so the token URL sets the cookie)
    #
    # Cookie Max-Age reference:
    #   7776000 = 90 days  (team members)
    #   2592000 = 30 days
    #   604800  = 7 days
    #   86400   = 1 day    (short-term guest access)
    #
    # Steps to add a new person:
    #   1. Generate:  openssl rand -hex 32
    #   2. Add the token to the map block in nginx-http.conf
    #   3. Copy one of the if-blocks below, paste it, replace:
    #      - The token string (in both $arg_token and Set-Cookie value)
    #      - The Max-Age (choose from reference above)
    #   4. Mirror changes in template.yaml (for future EC2 deploys)
    #   5. Deploy:  sudo nginx -t && sudo systemctl reload nginx
    #   6. Send them: https://synaptic.synapsis-analytics.com/auth?token=THEIR_TOKEN
    #
    # To revoke: remove the if-block here + the map entry + reload Nginx.
    # The person's existing cookie will still work until it expires, but
    # they won't be able to get a new one. To force immediate revocation,
    # also remove their token from the map block in nginx-http.conf.
    # -------------------------------------------------------------------
    location = /auth {
        auth_basic off;

        # Team — permanent token (90-day cookie)
        if ($arg_token = "c26155fc3601a74bf97c71cc161f5e9de2b1155420d5ec6f7861acd8058bdc1b") {
            add_header Set-Cookie "synaptic_auth=c26155fc3601a74bf97c71cc161f5e9de2b1155420d5ec6f7861acd8058bdc1b; Path=/; Max-Age=7776000; Secure; HttpOnly; SameSite=Lax; Domain=.synaptic.synapsis-analytics.com" always;
            return 302 /;
        }

        # --- Per-person token entries (uncomment, duplicate, and customize) ---
        #
        # # Guest — Client A (7-day cookie)
        # if ($arg_token = "PASTE_TOKEN_HERE") {
        #     add_header Set-Cookie "synaptic_auth=PASTE_TOKEN_HERE; Path=/; Max-Age=604800; Secure; HttpOnly; SameSite=Lax; Domain=.synaptic.synapsis-analytics.com" always;
        #     return 302 /;
        # }

        return 403;
    }

    # Static assets — cache aggressively (Vite hashed filenames = safe to cache forever)
    location /assets/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets on EC2 — only fetched through tunnel once
        proxy_cache tunnel_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_key $uri;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Favicon and other static files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache tunnel_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_key $uri;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Browser permissions — explicitly allow microphone for voice-to-text.
    # Without this, some browsers (especially on mobile or behind proxies)
    # block navigator.mediaDevices.getUserMedia() with a NotAllowedError.
    add_header Permissions-Policy "microphone=(self)" always;

    # API and dynamic routes — no cache
    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable request buffering for large audio uploads (voice-to-text).
        # Streams the request body directly to the backend instead of buffering
        # the entire file on the proxy first.
        proxy_request_buffering off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# =====================================================================
# Port-based subdomains — p{PORT}.synaptic.synapsis-analytics.com
#
# All backends serve plain HTTP. SSL is terminated at nginx (Let's Encrypt).
# nginx proxies to localhost backends over HTTP via the SSH tunnel.
#
# Allowed port ranges:
#   5173-5178  (Vite dev servers)
#   4173-4178  (Vite preview)
#   3000-3010  (Node/React dev servers)
#   7777-7790  (Synapsis agent apps)
#   8000-8100  (Generic dev servers)
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name ~^p(?<port>\d+)\.synaptic\.synapsis-analytics\.com$;

    ssl_certificate /etc/letsencrypt/live/synaptic-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synaptic-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Three-tier auth inherited from $synaptic_auth_realm (IP + cookie + Basic Auth).
    # Dev ports (Vite/preview/Node) additionally skip auth for fetch()/dynamic imports.
    set $auth_realm $synaptic_auth_realm;
    if ($port ~ "^(517[3-8])$")     { set $auth_realm off; }
    if ($port ~ "^(417[3-8])$")     { set $auth_realm off; }
    if ($port ~ "^(300[0-9]|3010)$") { set $auth_realm off; }
    auth_basic $auth_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    set $port_ok 0;
    set $backend_proto http;

    if ($port ~ "^(517[3-8])$")     { set $port_ok 1; }
    if ($port ~ "^(417[3-8])$")     { set $port_ok 1; }
    if ($port ~ "^(300[0-9]|3010)$") { set $port_ok 1; }
    if ($port ~ "^(777[7-9]|778[0-9]|7790)$") { set $port_ok 1; }
    if ($port ~ "^(80[0-9][0-9]|8100)$") { set $port_ok 1; }

    # Static assets — cache on EC2
    location /assets/ {
        if ($port_ok = 0) { return 403; }

        proxy_pass $backend_proto://127.0.0.1:$port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache tunnel_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_key $port$uri;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location / {
        if ($port_ok = 0) { return 403; }

        proxy_pass $backend_proto://127.0.0.1:$port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        if ($port_ok = 0) { return 403; }

        proxy_pass $backend_proto://127.0.0.1:$port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
